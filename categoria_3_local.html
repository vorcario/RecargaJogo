<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/mockup.css"><link rel="stylesheet" href="css/category-content.css"></head>
<body><main class="content category-shell"><div class="payment-grid">
  <button class="payment-card" type="button"><img src="img/pagamento_pix.png" alt=""><span class="payment-name">Pix</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_nupay.png" alt=""><span class="payment-name">NuPay</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_picpay.png" alt=""><span class="payment-name">PicPay</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_cartao_credito.png" alt=""><span class="payment-name">Cartão de Crédito</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card has-new" type="button"><img src="img/pagamento_mercado_pago.png" alt=""><span class="payment-name">Mercado Pago</span><span class="promo-badge"><i></i>PROMO</span><span class="new-badge">NOVO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_google_pay.png" alt=""><span class="payment-name">Google Pay</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_pagseguro.png" alt=""><span class="payment-name">Carteira Virtual</span><span class="promo-badge"><i></i>PROMO</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_boleto.png" alt=""><span class="payment-name">Boleto</span></button>
  <button class="payment-card" type="button"><img src="img/pagamento_razer_gold.png" alt=""><span class="payment-name">Razer Gold</span><span class="promo-badge"><i></i>PROMO</span></button>
</div></main><div id="category-toast" class="toast" role="status"></div><script src="js/category-interactions.js"></script></body></html>
